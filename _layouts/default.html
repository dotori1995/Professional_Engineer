<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="theme-color" content="#1f6feb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{ site.short_name }}">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
  <link rel="icon" href="{{ '/assets/icons/icon-192.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    window.PE = { domainsMeta: {{ site.domains | jsonify }}, base: "{{ site.baseurl }}", data: "{{ '/data.json' | relative_url }}", sw: "{{ '/sw.js' | relative_url }}" };
    (function(){ var t = localStorage.getItem('pe-theme'); if (t) document.documentElement.setAttribute('data-theme', t); })();
  </script>
</head>
<body class="page-{{ page.page_id | default: 'x' }}">
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="메뉴 열기" aria-controls="drawer" aria-expanded="false">☰</button>
    <a class="brand" href="{{ '/' | relative_url }}">📘 {{ site.short_name }}<span class="cur-dom" id="curDom"></span></a>
    <nav class="topnav" aria-label="바로가기">
      <a href="{{ '/' | relative_url }}" data-nav="home" class="{% if page.page_id == 'home' %}on{% endif %}" >목록</a>
      <a href="{{ '/cards/' | relative_url }}" data-nav="cards" class="{% if page.page_id == 'cards' %}on{% endif %}" >카드</a>
      <a href="{{ '/quiz/' | relative_url }}" data-nav="quiz" class="{% if page.page_id == 'quiz' %}on{% endif %}" >서술</a>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="다크 모드 전환">🌓</button>
    </nav>
  </header>
  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-bg" data-close></div>
    <div class="drawer-panel" role="dialog" aria-label="메뉴">
      <div class="dr-head"><b>메뉴</b><button class="icon-btn" type="button" data-close aria-label="메뉴 닫기">✕</button></div>
      <div id="drawerBody"><p class="meta">불러오는 중…</p></div>
    </div>
  </aside>
  <main class="wrap">
    {{ content }}
  </main>
  <script src="{{ '/assets/js/app.js' | relative_url }}"></script>
  {% if page.script %}<script src="{{ page.script | relative_url }}"></script>{% endif %}
</body>
</html>
